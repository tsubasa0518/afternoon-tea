name: Test offline data and HTML pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run offline tests (standard library only)
        run: python3 -m unittest discover -s tests -v
      - name: Verify protected files and canonical catalog
        run: |
          python3 -m afternoon_tea check-protected
          python3 -m afternoon_tea validate-catalog
