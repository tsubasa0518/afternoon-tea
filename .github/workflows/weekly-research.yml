name: Manual read-only legacy diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: legacy-manual-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate protection and reservation guard
        run: |
          python3 -m unittest discover -s tests -v
          python3 -c 'from afternoon_tea.pipeline import protected_files; protected_files()'
      - name: Run dry diagnostic in isolated staging state
        run: python3 -m afternoon_tea.weekly --state-dir .staging/legacy-diagnostic-state
        env:
          PYTHONUNBUFFERED: '1'
      - name: Save diagnostic artifacts only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: legacy-diagnostic-${{ github.run_id }}
          path: .staging/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
